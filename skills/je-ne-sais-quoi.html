<script>
document.querySelectorAll('.carousel').forEach(function (c) {
  var track = c.querySelector('.ctrack'), btns = Array.prototype.slice.call(c.querySelectorAll('.cnav button'));
  function active() {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    btns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
  }
  btns.forEach(function (b, i) {
    b.addEventListener('click', function () { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); });
  });
  track.addEventListener('scroll', function () { clearTimeout(c._t); c._t = setTimeout(active, 90); });
  c.tabIndex = 0;
  c.addEventListener('keydown', function (e) {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (e.key === 'ArrowRight') { track.scrollTo({ left: (i + 1) * track.clientWidth, behavior: 'smooth' }); }
    if (e.key === 'ArrowLeft') { track.scrollTo({ left: Math.max(0, i - 1) * track.clientWidth, behavior: 'smooth' }); }
  });
  active();
});
</script>
<script>
(function () {
  function hydrate(el) {
    el.querySelectorAll('img[data-src]').forEach(function (i) {
      i.src = i.getAttribute('data-src'); i.removeAttribute('data-src');
    });
  }
  // Progressive hydration: no dependency on scroll/rAF/IntersectionObserver
  // (each of those is unreliable on some real devices and renderers).
  function queue() {
    var els = Array.prototype.slice.call(
      document.querySelectorAll('.card-strip:not([data-h]), .carousel:not([data-h])'));
    if (!els.length) return;
    els.slice(0, 6).forEach(function (el) { el.setAttribute('data-h', '1'); hydrate(el); });
  }
  var slow = false;
  try {
    var c = navigator.connection || {};
    slow = !!(c.saveData || /(^|-)2g$/.test(c.effectiveType || ''));
  } catch (e) {}
  if (!slow) {
    queue();                       // first batch right away, after the first paints
    var iv = setInterval(function () {
      if (document.querySelector('.card-strip:not([data-h]), .carousel:not([data-h])')) queue();
      else clearInterval(iv);
    }, 350);
  }
  window.addEventListener('touchstart', queue, { passive: true });
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t) { t.setAttribute('data-h', '1'); hydrate(t); }
  }, true);
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t) { t.setAttribute('data-h', '1'); hydrate(t); }
  }, true);
  if (document.readyState === 'complete') { setTimeout(queue, 300); }
  else { window.addEventListener('load', function () { setTimeout(queue, 300); }); }
})();
</script>
