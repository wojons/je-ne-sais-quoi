<script>
document.querySelectorAll('.carousel').forEach(function (c) {
  var track = c.querySelector('.ctrack'), btns = Array.prototype.slice.call(c.querySelectorAll('.cnav button'));
  function active() {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    btns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
  }
  btns.forEach(function (b, i) {
    b.addEventListener('click', function () { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); });
  });
  track.addEventListener('scroll', function () { clearTimeout(c._t); c._t = setTimeout(active, 90); });
  c.tabIndex = 0;
  c.addEventListener('keydown', function (e) {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (e.key === 'ArrowRight') { track.scrollTo({ left: (i + 1) * track.clientWidth, behavior: 'smooth' }); }
    if (e.key === 'ArrowLeft') { track.scrollTo({ left: Math.max(0, i - 1) * track.clientWidth, behavior: 'smooth' }); }
  });
  active();
});
</script>
<script>
(function () {
  var CAP = 3;   // alternates loaded per card before it is touched
  function hydrate(el, all) {
    var imgs = el.querySelectorAll('img[data-src]');
    for (var i = 0; i < imgs.length; i++) {
      if (!all && i >= CAP) break;
      imgs[i].src = imgs[i].getAttribute('data-src');
      imgs[i].removeAttribute('data-src');
    }
  }
  // Visibility is checked on a timer rather than via scroll events,
  // requestAnimationFrame or IntersectionObserver: all three are unreliable
  // or absent on some real devices and renderers, timers are not.
  function hydrateNear() {
    var vh = window.innerHeight || 800;
    var elapsed = (Date.now() - started) / 1000;
    document.querySelectorAll('.card-strip, .carousel').forEach(function (el) {
      var r = el.getBoundingClientRect();
      var inView = r.top < vh * 1.8 && r.bottom > -vh;
      if (inView) {
        if (!el.hasAttribute('data-h')) { el.setAttribute('data-h', '1'); hydrate(el); }
        else if (elapsed < 45 && !el.hasAttribute('data-h2')) {
          el.setAttribute('data-h2', '1'); hydrate(el);   // second wave for what is on screen
        }
      }
    });
  }
  var started = Date.now();
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t) hydrate(t, true);
  }, true);
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t) hydrate(t, true);
  }, true);
  window.addEventListener('touchstart', function () { hydrateNear(); }, { passive: true });
  hydrateNear();
  var iv = setInterval(hydrateNear, 800);
  window.addEventListener('load', function () { hydrateNear(); });
})();
</script>
