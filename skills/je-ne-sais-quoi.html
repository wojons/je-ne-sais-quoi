<script>
document.querySelectorAll('.carousel').forEach(function (c) {
  var track = c.querySelector('.ctrack'), btns = Array.prototype.slice.call(c.querySelectorAll('.cnav button'));
  function active() {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    btns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
  }
  btns.forEach(function (b, i) {
    b.addEventListener('click', function () { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); });
  });
  track.addEventListener('scroll', function () { clearTimeout(c._t); c._t = setTimeout(active, 90); });
  c.tabIndex = 0;
  c.addEventListener('keydown', function (e) {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (e.key === 'ArrowRight') { track.scrollTo({ left: (i + 1) * track.clientWidth, behavior: 'smooth' }); }
    if (e.key === 'ArrowLeft') { track.scrollTo({ left: Math.max(0, i - 1) * track.clientWidth, behavior: 'smooth' }); }
  });
  active();
});
</script>
<script>
(function () {
  function hydrate(el) {
    el.querySelectorAll('img[data-src]').forEach(function (i) {
      i.src = i.getAttribute('data-src'); i.removeAttribute('data-src');
    });
  }
  function hydrateNear() {
    var vh = window.innerHeight || 800;
    document.querySelectorAll('.card-strip:not([data-h]), .carousel:not([data-h])').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.top < vh * 1.6 && r.bottom > -vh) { el.setAttribute('data-h', '1'); hydrate(el); }
    });
  }
  var pending = false;
  function onScroll() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; hydrateNear(); });
  }
  // deterministic triggers only — no reliance on lazy-loading or IntersectionObserver
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('touchstart', hydrateNear, { passive: true });
  window.addEventListener('resize', hydrateNear);
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t && !t.hasAttribute('data-h')) { t.setAttribute('data-h', '1'); hydrate(t); }
  }, true);
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest ? e.target.closest('.card-strip, .carousel') : null;
    if (t && !t.hasAttribute('data-h')) { t.setAttribute('data-h', '1'); hydrate(t); }
  }, true);
  if (document.readyState === 'complete') { setTimeout(hydrateNear, 400); }
  else { window.addEventListener('load', function () { setTimeout(hydrateNear, 400); }); }
  setTimeout(hydrateNear, 1500);
})();
</script>
